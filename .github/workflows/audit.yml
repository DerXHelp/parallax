# Known vulnerabilities in all dependencies (WP-85, docs/wp/WP-83.md §6.1): weekly and by hand.
# pnpm reads its own lockfile completely - the Dependabot alerts miss parts of the pnpm 12 lockfile.
# A finding fails the run and GitHub mails the owner. High/critical before the 14-day wait: the user
# decides case by case.
name: Audit

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm audit
