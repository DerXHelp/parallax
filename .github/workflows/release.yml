# Release of a tag vX.Y.Z (WP-85, docs/wp/WP-83.md §6). Four jobs, one after the other:
#   build   - checks, build, E2E, release-pack (no secret, read-only)
#   sign    - environment "release": signs release.json, zips, writes and signs latest.json, draft release
#             (installs nothing, runs only scripts/release/sign.ts)
#   smoke   - the finished zip under the minimum Node and Node 26 (FakeBackend, temp home)
#   publish - the draft becomes public; a failure before leaves at most a draft
# Actions are pinned by commit SHA (version as comment), updated only when older than 14 days.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Tag, version and changelog
        id: version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          pnpm exec tsx --tsconfig tsconfig.tools.json scripts/release-notes.ts --check-tag "$env:GITHUB_REF_NAME"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Known vulnerabilities (runtime, high or critical)
        run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm build
      - run: pnpm e2e
      - name: E2E results (only on failure; server log, WS frames, trace, screenshot per failed test)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:RUNNER_TEMP 'package'
          $notes = Join-Path $out 'notes.md'
          pnpm exec tsx --tsconfig tsconfig.tools.json scripts/release-pack.ts --out $out
          # pwsh 7 writes UTF-8 without BOM.
          pnpm exec tsx --tsconfig tsconfig.tools.json scripts/release-notes.ts --extract $env:VERSION > $notes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            package.json
            scripts/release/sign.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Sign, zip, latest.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pkg = Join-Path $env:RUNNER_TEMP 'package'
          $folder = "parallax-$env:VERSION"
          $out = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'release')
          node scripts/release/sign.ts sign (Join-Path $pkg "$folder/release.json")
          $zip = Join-Path $out "$folder-win.zip"
          & (Join-Path $env:SystemRoot 'System32\tar.exe') -a -c -f $zip -C $pkg $folder
          Copy-Item (Join-Path $pkg "$folder/CHANGELOG.md") $out
          node scripts/release/sign.ts latest --zip $zip --version $env:VERSION --notes (Join-Path $pkg 'notes.md') --changelog (Join-Path $out 'CHANGELOG.md') --out (Join-Path $out 'latest.json')
          node scripts/release/sign.ts sign (Join-Path $out 'latest.json')
          Copy-Item (Join-Path $pkg 'notes.md') $out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:RUNNER_TEMP 'release'
          $assets = @("parallax-$env:VERSION-win.zip", 'latest.json', 'latest.json.sig', 'CHANGELOG.md') | ForEach-Object { Join-Path $out $_ }
          $flags = @('--draft', '--verify-tag', '--title', "Parallax $env:VERSION", '--notes-file', (Join-Path $out 'notes.md'))
          if ($env:VERSION.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY @flags @assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: [build, sign]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The minimum (engines.node, release.json minNode) and the standard version.
        node: ['24.5.0', '26']
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Verify, install the SDK, start, health
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $release = Join-Path $env:RUNNER_TEMP 'release'
          pnpm exec tsx --tsconfig tsconfig.tools.json scripts/release/smoke.ts --zip (Join-Path $release "parallax-$env:VERSION-win.zip") --latest (Join-Path $release 'latest.json') --work (Join-Path $env:RUNNER_TEMP 'smoke')

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false
