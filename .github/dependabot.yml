# Version updates (WP-85, docs/wp/WP-83.md §6.1): monthly, one grouped PR per ecosystem, only versions
# older than 14 days (cooldown = the project's 14-day rule). PRs are never merged on GitHub: the
# coordinator takes them into the current feature branch, checks the lockfile entries against the
# registry time and merges to main the usual way. Security updates stay off (they would skip the wait).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Updated with /claude-update and docs/sdk-upgrade.md (pinned exactly, live check).
      - dependency-name: '@anthropic-ai/claude-agent-sdk'
      # Major versions decided by hand (docs/wp/DEPS-2026-11.md §7):
      # the Node types follow the minimum Node version (engines.node), not the newest Node;
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7: typescript-eslint does not support it yet;
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # ESLint 10: eslint-plugin-react (react/jsx-no-literals) does not support it yet.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
